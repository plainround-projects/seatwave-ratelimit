# The Module 12 lab: Module 11's stack with three gateway instances instead of one, all sharing one
# Redis for their rate limits, and booking shedding beyond 64 holds in flight. Run it as Compose
# project seatwave-ratelimit. Ports are published on 127.0.0.1 alone, in Module 12's range 21200 to
# 21299: each gateway on its own port, so a test can play the balancer and spread one fan's
# requests over all three; Redis publishes nothing, because only the gateways may reach it.
name: seatwave-ratelimit

x-program: &program
  restart: "no"
  networks: [lab]

x-gateway: &gateway
  <<: *program
  build: { context: ., args: { PROGRAM: gateway } }
  environment:
    SEATWAVE_REDIS_HOST: redis
  depends_on:
    redis: { condition: service_healthy }
    issuer: { condition: service_started }
    catalog: { condition: service_started }
    booking: { condition: service_started }
    mobile-bff: { condition: service_started }
  deploy: { resources: { limits: { cpus: "1", memory: 768M } } }

services:
  redis:
    # Docker Official Image, tag and digest checked on Docker Hub on 11 November 2026 (8.10.3 was
    # the newest release; the digest is the multi-platform index, with an arm64 variant).
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    restart: "no"
    networks: [lab]
    # A limiter's state is worth nothing after a restart (every bucket refills within a minute), so
    # nothing is written to disk. When memory is full, Redis forgets the keys nearest to expiry:
    # the buckets that are almost full again, which is the cheapest thing a limiter can forget.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
    deploy: { resources: { limits: { cpus: "1", memory: 384M } } }

  issuer:
    <<: *program
    build: { context: ., args: { PROGRAM: issuer } }
    environment:
      SEATWAVE_ISSUER_KEY_FILE: /run/secrets/issuer_keys
    secrets: [issuer_keys]
    ports: ["127.0.0.1:21220:8080"]
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  catalog:
    <<: *program
    build: { context: ., args: { PROGRAM: catalog } }
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  booking:
    <<: *program
    build: { context: ., args: { PROGRAM: booking } }
    environment:
      SEATWAVE_BOOKING_READ_DELAY: ${SEATWAVE_BOOKING_READ_DELAY:-0s}
      # The shedding lab sets 8: delayed reads beyond 8 at once wait in line.
      SEATWAVE_BOOKING_READ_WORKERS: ${SEATWAVE_BOOKING_READ_WORKERS:-10000}
      # Lab 3 lowers this to see shedding at a load a laptop can send.
      SEATWAVE_BOOKING_MAX_IN_FLIGHT: ${SEATWAVE_BOOKING_MAX_IN_FLIGHT:-64}
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  mobile-bff:
    <<: *program
    build: { context: ., args: { PROGRAM: mobile-bff } }
    depends_on: [catalog, booking]
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  gateway-1:
    <<: *gateway
    ports: ["127.0.0.1:21200:8080", "127.0.0.1:21210:8081"]

  gateway-2:
    <<: *gateway
    ports: ["127.0.0.1:21201:8080", "127.0.0.1:21211:8081"]

  gateway-3:
    <<: *gateway
    ports: ["127.0.0.1:21202:8080", "127.0.0.1:21212:8081"]

networks:
  lab: {}

secrets:
  # Generated by ./gradlew :issuer:keys into build/, which git ignores; never committed.
  issuer_keys:
    file: ./build/keys/issuer-keys.json
