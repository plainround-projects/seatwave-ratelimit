# Every version is exact. Each was checked on Maven Central or the Gradle Plugin Portal on 11 November 2026.
# Spring Boot's bill of materials manages Spring, Spring Data Redis 4.1.2, Lettuce 7.5.2.RELEASE, Jackson 3,
# Logback, JUnit, AssertJ and Awaitility; the versions it chose are the ones Boot 4.1.2 was released and tested
# with (Lettuce 7.9.0.RELEASE was newer on 11 November 2026, and is not forced over Boot's choice).
[versions]
springBoot = "4.1.2"
springCloud = "2025.1.4"
result4j = "1.2.0"
# The Nimbus version Spring Security 7.1.2 itself depends on, so the issuer signs with the same library
# release the gateway verifies with (10.10 was newer on 11 November 2026).
nimbus = "10.9.1"
spotless = "8.11.0"
googleJavaFormat = "2.0.0"
jacoco = "0.8.16"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "springCloud" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
# New in Module 12: Spring Data Redis and Lettuce, for the shared token bucket.
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-cloud-starter-gateway-server-webmvc = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus" }
result4j = { module = "com.github.sviperll:result4j", version.ref = "result4j" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
